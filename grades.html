<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>成绩查询 - 学生选课管理系统</title>
    <link href="https://cdn.bootcdn.net/ajax/libs/twitter-bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.bootcdn.net/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-custom">
        <div class="container-fluid">
            <a class="navbar-brand" href="#"><i class="bi bi-mortarboard-fill"></i>学生选课管理系统</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" id="nav-courses" href="dashboard.html">
                            <i class="bi bi-grid-fill me-1"></i>可选课程
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" id="nav-schedule" href="my_courses.html">
                            <i class="bi bi-calendar-week me-1"></i>我的课表
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" id="nav-grades" href="grades.html">
                            <i class="bi bi-journal-text me-1"></i>成绩查询
                        </a>
                    </li>
                </ul>
                <div class="d-flex align-items-center gap-3">
                    <span id="userDisplay" class="user-badge"></span>
                    <button class="btn-logout" id="btnLogout">
                        <i class="bi bi-box-arrow-right me-1"></i>退出
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <div class="container-fluid py-4 px-4">
        <div class="page-header">
            <h4><i class="bi bi-journal-text me-2"></i>成绩查询</h4>
            <p>查看已录入的课程成绩、已获学分和GPA绩点</p>
        </div>

        <!-- GPA 概览卡片 -->
        <div class="row g-3 mb-4" id="gpaStatsRow"></div>

        <!-- 成绩明细 -->
        <div class="section-card">
            <div class="section-title"><i class="bi bi-list-ul me-2"></i>成绩明细</div>
            <div class="table-responsive">
                <table class="table table-custom">
                    <thead>
                        <tr>
                            <th>课程号</th><th>课程名称</th><th>学分</th>
                            <th>成绩</th><th>绩点</th><th>状态</th><th>已获学分</th>
                        </tr>
                    </thead>
                    <tbody id="gradesTableBody">
                        <tr><td colspan="7" class="text-center text-muted py-4">加载中...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- 成绩分布图 -->
        <div class="row g-3 mt-2">
            <div class="col-lg-8">
                <div class="section-card">
                    <div class="section-title"><i class="bi bi-bar-chart me-2"></i>成绩分布</div>
                    <div id="gradeChart" style="min-height:250px;"></div>
                </div>
            </div>
            <div class="col-lg-4">
                <div class="section-card">
                    <div class="section-title"><i class="bi bi-info-circle me-2"></i>绩点说明</div>
                    <div style="font-size:.88rem;color:var(--dark);">
                        <p><strong>绩点公式：</strong>(成绩 - 50) / 10</p>
                        <p class="text-muted">例：85分 → (85-50)/10 = <strong>3.5</strong></p>
                        <hr>
                        <p><strong>学分绩点：</strong>绩点 × 学分</p>
                        <p><strong>GPA：</strong>Σ(学分绩点) / Σ(学分)</p>
                        <hr>
                        <p class="mb-0 text-muted" style="font-size:.8rem;">
                            <i class="bi bi-info-circle me-1"></i>仅统计已录入成绩的课程，不及格课程绩点为0
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="toast-container" id="toastContainer"></div>

    <script src="https://cdn.bootcdn.net/ajax/libs/twitter-bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/utils.js"></script>
    <script>
        requireRole('student');

        document.addEventListener('DOMContentLoaded', () => {
            setActiveNav('nav-grades');
            loadGrades();
        });

        async function loadGrades() {
            showLoading();
            try {
                // 并行加载成绩和GPA
                const [gradesData, gpaData] = await Promise.all([
                    StudentAPI.getMyGrades(),
                    StudentAPI.getMyGPA().catch(() => null),
                ]);
                const grades = gradesData.data || gradesData || [];
                const gpa = gpaData || {};

                renderGPAStats(grades, gpa);
                renderTable(grades);
                renderChart(grades);
            } catch (err) {
                showToast('加载成绩失败: ' + err.message, 'danger');
                document.getElementById('gradesTableBody').innerHTML =
                    '<tr><td colspan="7" class="text-center text-danger py-4">加载失败，请刷新重试</td></tr>';
            } finally {
                hideLoading();
            }
        }

        function renderGPAStats(grades, gpa) {
            const gradedCourses = grades.filter(g => g.grade !== null && g.grade !== undefined && g.grade !== '');
            const totalCredits = gradedCourses.reduce((sum, g) => sum + (parseFloat(g.credit) || 0), 0);
            const earnedCredits = gradedCourses.filter(g => parseFloat(g.grade) >= 60)
                .reduce((sum, g) => sum + (parseFloat(g.credit) || 0), 0);
            const avgScore = gradedCourses.length > 0
                ? (gradedCourses.reduce((sum, g) => sum + parseFloat(g.grade), 0) / gradedCourses.length).toFixed(1)
                : '--';
            const gpaVal = gpa.p_gpa || gpa.gpa || '--';

            document.getElementById('gpaStatsRow').innerHTML = `
                <div class="col-xl-3 col-md-6">
                    <div class="card stat-card">
                        <div class="card-body d-flex align-items-center gap-3">
                            <div class="stat-icon" style="background:var(--pri);"><i class="bi bi-calculator"></i></div>
                            <div><div class="stat-value" style="color:var(--sec);">${gpaVal}</div><div class="stat-label">GPA 绩点</div></div>
                        </div>
                    </div>
                </div>
                <div class="col-xl-3 col-md-6">
                    <div class="card stat-card">
                        <div class="card-body d-flex align-items-center gap-3">
                            <div class="stat-icon" style="background:var(--acc);"><i class="bi bi-trophy"></i></div>
                            <div><div class="stat-value">${avgScore}</div><div class="stat-label">平均分</div></div>
                        </div>
                    </div>
                </div>
                <div class="col-xl-3 col-md-6">
                    <div class="card stat-card">
                        <div class="card-body d-flex align-items-center gap-3">
                            <div class="stat-icon" style="background:#27ae60;"><i class="bi bi-check-circle"></i></div>
                            <div><div class="stat-value">${earnedCredits}</div><div class="stat-label">已获学分</div></div>
                        </div>
                    </div>
                </div>
                <div class="col-xl-3 col-md-6">
                    <div class="card stat-card">
                        <div class="card-body d-flex align-items-center gap-3">
                            <div class="stat-icon" style="background:var(--sec);"><i class="bi bi-book"></i></div>
                            <div><div class="stat-value">${totalCredits}</div><div class="stat-label">修读学分</div></div>
                        </div>
                    </div>
                </div>`;
        }

        function renderTable(grades) {
            const tbody = document.getElementById('gradesTableBody');
            if (grades.length === 0) {
                tbody.innerHTML = `<tr><td colspan="7" class="text-center text-muted py-4">
                    <i class="bi bi-inbox" style="font-size:1.5rem;"></i>
                    <p class="mt-2 mb-0">暂无已录入的成绩</p>
                </td></tr>`;
                return;
            }

            tbody.innerHTML = grades.map(g => {
                const grade = g.grade ?? g.score;
                const hasGrade = grade !== null && grade !== undefined && grade !== '';
                const numGrade = parseFloat(grade);
                const point = hasGrade ? calcGradePoint(numGrade) : '--';
                const earned = hasGrade && numGrade >= 60 ? (parseFloat(g.credit) || 0) : 0;
                return `
                <tr>
                    <td><code>${g.course_id}</code></td>
                    <td><strong>${g.course_name}</strong></td>
                    <td>${g.credit}</td>
                    <td>${hasGrade ? `<strong>${grade}</strong>` : '--'}</td>
                    <td>${hasGrade ? point : '--'}</td>
                    <td>${getGradeBadge(grade)}</td>
                    <td>${hasGrade ? (earned > 0 ? `<span class="text-success fw-bold">${earned}</span>` : '<span class="text-danger">0</span>') : '--'}</td>
                </tr>`;
            }).join('');
        }

        function renderChart(grades) {
            const gradedCourses = grades.filter(g => g.grade !== null && g.grade !== undefined && g.grade !== '');
            if (gradedCourses.length === 0) {
                document.getElementById('gradeChart').innerHTML =
                    '<p class="text-center text-muted py-5">暂无数据</p>';
                return;
            }

            // 成绩区间统计
            const ranges = [
                { label: '90-100', min: 90, max: 100, color: '#27ae60' },
                { label: '80-89', min: 80, max: 89, color: '#2ecc71' },
                { label: '70-79', min: 70, max: 79, color: '#3495DB' },
                { label: '60-69', min: 60, max: 69, color: '#E67E22' },
                { label: '<60', min: 0, max: 59, color: '#E74C3C' },
            ];

            const counts = ranges.map(r => gradedCourses.filter(g => {
                const v = parseFloat(g.grade);
                return v >= r.min && v <= r.max;
            }).length);

            const maxCount = Math.max(...counts, 1);

            document.getElementById('gradeChart').innerHTML = `
                <div class="d-flex align-items-end gap-3" style="height:200px;padding:0 20px;">
                    ${ranges.map((r, i) => {
                        const h = (counts[i] / maxCount * 150) || 5;
                        return `
                        <div class="text-center flex-fill">
                            <div style="font-size:.8rem;font-weight:600;margin-bottom:4px;">${counts[i]}人</div>
                            <div style="height:${h}px;background:${r.color};border-radius:8px 8px 0 0;min-width:50px;transition:all .3s;"
                                 title="${r.label}: ${counts[i]}人"></div>
                            <div style="font-size:.78rem;margin-top:6px;color:var(--lit);">${r.label}</div>
                        </div>`;
                    }).join('')}
                </div>`;
        }
    </script>
</body>
</html>
