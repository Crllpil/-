<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>课程管理 - 学生选课管理系统</title>
    <link href="https://cdn.bootcdn.net/ajax/libs/twitter-bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.bootcdn.net/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-custom">
        <div class="container-fluid">
            <a class="navbar-brand" href="#"><i class="bi bi-mortarboard-fill"></i>学生选课管理系统</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link" id="nav-dashboard" href="dashboard.html"><i class="bi bi-speedometer2 me-1"></i>系统概览</a></li>
                    <li class="nav-item"><a class="nav-link" id="nav-students" href="manage_students.html"><i class="bi bi-person-fill me-1"></i>学生管理</a></li>
                    <li class="nav-item"><a class="nav-link" id="nav-teachers" href="manage_teachers.html"><i class="bi bi-person-workspace me-1"></i>教师管理</a></li>
                    <li class="nav-item"><a class="nav-link active" id="nav-courses" href="manage_courses.html"><i class="bi bi-book-fill me-1"></i>课程管理</a></li>
                </ul>
                <div class="d-flex align-items-center gap-3">
                    <span id="userDisplay" class="user-badge"></span>
                    <button class="btn-logout" id="btnLogout"><i class="bi bi-box-arrow-right me-1"></i>退出</button>
                </div>
            </div>
        </div>
    </nav>

    <div class="container-fluid py-4 px-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <div class="page-header mb-0">
                <h4><i class="bi bi-book-fill me-2"></i>课程信息管理</h4>
                <p>管理课程基本信息，包括课程编号、名称、学分、容量、上课时间地点及授课教师</p>
            </div>
            <button class="btn btn-warning-custom" onclick="showAddModal()">
                <i class="bi bi-plus-lg me-1"></i>添加课程
            </button>
        </div>

        <div class="filter-bar">
            <input type="text" class="form-control" id="searchInput" placeholder="🔍 搜索课程号/课程名/教师..." oninput="filterTable()">
            <select class="form-select" id="filterTeacher" onchange="filterTable()">
                <option value="">全部教师</option>
            </select>
            <span class="ms-auto text-muted" style="font-size:.85rem;">共 <strong id="totalCount">0</strong> 门课程</span>
        </div>

        <div class="section-card p-0">
            <div class="table-responsive">
                <table class="table table-custom mb-0">
                    <thead>
                        <tr>
                            <th>课程号</th><th>课程名称</th><th>学分</th><th>容量</th>
                            <th>上课时间</th><th>上课地点</th><th>授课教师</th><th>操作</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody">
                        <tr><td colspan="8" class="text-center text-muted py-4">加载中...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- 编辑模态框 -->
    <div class="modal fade" id="editModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header" id="editModalHeader">
                    <h5 class="modal-title"><i class="bi bi-book-plus me-2"></i>添加课程</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="editMode" value="add">
                    <input type="hidden" id="origCourseId" value="">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label">课程号 <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="courseId" maxlength="8" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">课程名称 <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="courseName" maxlength="50" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">学分 <span class="text-danger">*</span></label>
                            <input type="number" class="form-control" id="credit" min="0.5" max="10" step="0.5" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">课容量 <span class="text-danger">*</span></label>
                            <input type="number" class="form-control" id="capacity" min="1" max="300" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">授课教师 <span class="text-danger">*</span></label>
                            <select class="form-select" id="teacherId" required>
                                <option value="">-- 请选择 --</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">上课时间</label>
                            <input type="text" class="form-control" id="scheduleTime" maxlength="50" placeholder="例：周一 8:00-10:00">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">上课地点</label>
                            <input type="text" class="form-control" id="location" maxlength="30" placeholder="例：教学楼A201">
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                    <button type="button" class="btn btn-warning-custom" id="saveBtn" onclick="saveCourse()">
                        <i class="bi bi-check-lg me-1"></i>保 存
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div class="toast-container" id="toastContainer"></div>

    <script src="https://cdn.bootcdn.net/ajax/libs/twitter-bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/utils.js"></script>
    <script>
        let allCourses = [];
        let teacherList = [];
        requireRole('admin');

        document.addEventListener('DOMContentLoaded', () => {
            setActiveNav('nav-courses');
            loadData();
        });

        async function loadData() {
            showLoading();
            try {
                const [coursesData, teachersData] = await Promise.all([
                    AdminAPI.getCourses(),
                    AdminAPI.getTeachers(),
                ]);
                allCourses = coursesData.data || coursesData || [];
                teacherList = teachersData.data || teachersData || [];

                document.getElementById('totalCount').textContent = allCourses.length;

                // 填充教师筛选
                const filterSelect = document.getElementById('filterTeacher');
                filterSelect.innerHTML = '<option value="">全部教师</option>' +
                    teacherList.map(t => `<option value="${t.teacher_id}">${t.name} (${t.teacher_id})</option>`).join('');

                renderTable(allCourses);
            } catch (err) {
                showToast('加载数据失败: ' + err.message, 'danger');
            } finally { hideLoading(); }
        }

        function renderTable(courses) {
            const tbody = document.getElementById('tableBody');
            if (courses.length === 0) {
                tbody.innerHTML = '<tr><td colspan="8" class="text-center text-muted py-4">暂无课程数据</td></tr>';
                return;
            }
            tbody.innerHTML = courses.map(c => {
                const teacher = teacherList.find(t => t.teacher_id === c.teacher_id);
                const teacherName = teacher ? teacher.name : (c.teacher_name || c.teacher_id);
                return `
                <tr>
                    <td><code>${c.course_id}</code></td>
                    <td><strong>${c.course_name}</strong></td>
                    <td>${c.credit}</td>
                    <td>${c.capacity}</td>
                    <td>${c.schedule_time || '--'}</td>
                    <td>${c.location || '--'}</td>
                    <td>${teacherName}</td>
                    <td>
                        <button class="btn btn-sm btn-outline-primary me-1" onclick="showEditModal('${c.course_id}')">
                            <i class="bi bi-pencil"></i> 编辑
                        </button>
                        <button class="btn btn-sm btn-outline-danger" onclick="deleteCourse('${c.course_id}','${c.course_name}')">
                            <i class="bi bi-trash"></i> 删除
                        </button>
                    </td>
                </tr>`;
            }).join('');
        }

        function filterTable() {
            const kw = document.getElementById('searchInput').value.toLowerCase();
            const teacherFilter = document.getElementById('filterTeacher').value;
            let filtered = allCourses;
            if (kw) {
                filtered = filtered.filter(c =>
                    c.course_id.toLowerCase().includes(kw) ||
                    c.course_name.toLowerCase().includes(kw) ||
                    (c.teacher_name || '').toLowerCase().includes(kw)
                );
            }
            if (teacherFilter) {
                filtered = filtered.filter(c => c.teacher_id === teacherFilter);
            }
            document.getElementById('totalCount').textContent = filtered.length;
            renderTable(filtered);
        }

        function populateTeacherSelect(selectedId) {
            const select = document.getElementById('teacherId');
            select.innerHTML = '<option value="">-- 请选择 --</option>' +
                teacherList.map(t => `<option value="${t.teacher_id}" ${t.teacher_id === selectedId ? 'selected' : ''}>${t.name} (${t.teacher_id}) ${t.title ? '- ' + t.title : ''}</option>`).join('');
        }

        function showAddModal() {
            document.getElementById('editMode').value = 'add';
            document.getElementById('origCourseId').value = '';
            document.getElementById('editModalHeader').innerHTML = '<h5 class="modal-title"><i class="bi bi-book-plus me-2"></i>添加课程</h5>';
            document.getElementById('courseId').value = '';
            document.getElementById('courseId').disabled = false;
            document.getElementById('courseName').value = '';
            document.getElementById('credit').value = '3.0';
            document.getElementById('capacity').value = '60';
            document.getElementById('scheduleTime').value = '';
            document.getElementById('location').value = '';
            populateTeacherSelect('');
            document.getElementById('saveBtn').innerHTML = '<i class="bi bi-check-lg me-1"></i>保 存';
            new bootstrap.Modal(document.getElementById('editModal')).show();
        }

        function showEditModal(courseId) {
            const c = allCourses.find(co => co.course_id === courseId);
            if (!c) return showToast('未找到该课程', 'danger');

            document.getElementById('editMode').value = 'edit';
            document.getElementById('origCourseId').value = courseId;
            document.getElementById('editModalHeader').innerHTML = '<h5 class="modal-title"><i class="bi bi-pencil me-2"></i>编辑课程信息</h5>';
            document.getElementById('courseId').value = c.course_id;
            document.getElementById('courseId').disabled = true;
            document.getElementById('courseName').value = c.course_name;
            document.getElementById('credit').value = c.credit;
            document.getElementById('capacity').value = c.capacity;
            document.getElementById('scheduleTime').value = c.schedule_time || '';
            document.getElementById('location').value = c.location || '';
            populateTeacherSelect(c.teacher_id);
            new bootstrap.Modal(document.getElementById('editModal')).show();
        }

        async function saveCourse() {
            const mode = document.getElementById('editMode').value;
            const data = {
                course_id: document.getElementById('courseId').value.trim(),
                course_name: document.getElementById('courseName').value.trim(),
                credit: parseFloat(document.getElementById('credit').value),
                capacity: parseInt(document.getElementById('capacity').value),
                schedule_time: document.getElementById('scheduleTime').value.trim() || null,
                location: document.getElementById('location').value.trim() || null,
                teacher_id: document.getElementById('teacherId').value,
            };

            if (!data.course_id || !data.course_name || !data.teacher_id) {
                return showToast('请填写必填字段', 'warning');
            }
            if (isNaN(data.credit) || data.credit <= 0) return showToast('学分格式不正确', 'warning');
            if (isNaN(data.capacity) || data.capacity < 1 || data.capacity > 300) return showToast('容量应在1-300之间', 'warning');

            const btn = document.getElementById('saveBtn');
            btn.disabled = true; btn.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span>保存中...';
            try {
                if (mode === 'add') {
                    await AdminAPI.addCourse(data);
                    showToast('添加成功', 'success');
                } else {
                    await AdminAPI.updateCourse(document.getElementById('origCourseId').value, data);
                    showToast('更新成功', 'success');
                }
                bootstrap.Modal.getInstance(document.getElementById('editModal')).hide();
                loadData();
            } catch (err) {
                showToast('保存失败: ' + err.message, 'danger');
            } finally {
                btn.disabled = false; btn.innerHTML = '<i class="bi bi-check-lg me-1"></i>保 存';
            }
        }

        async function deleteCourse(courseId, courseName) {
            if (!confirm(`确定要删除课程 "${courseName}" (${courseId}) 吗？\n\n注意：已有学生选课的课程受外键约束不可删除。`)) return;
            try {
                await AdminAPI.deleteCourse(courseId);
                showToast('删除成功', 'success');
                loadData();
            } catch (err) {
                showToast('删除失败: ' + err.message, 'danger');
            }
        }
    </script>
</body>
</html>
