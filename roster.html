<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>学生名单 - 学生选课管理系统</title>
    <link href="https://cdn.bootcdn.net/ajax/libs/twitter-bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.bootcdn.net/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-custom">
        <div class="container-fluid">
            <a class="navbar-brand" href="#"><i class="bi bi-mortarboard-fill"></i>学生选课管理系统</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" id="nav-overview" href="dashboard.html">
                            <i class="bi bi-speedometer2 me-1"></i>课程概览
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" id="nav-roster" href="roster.html">
                            <i class="bi bi-people-fill me-1"></i>学生名单
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" id="nav-grades" href="grade_entry.html">
                            <i class="bi bi-pencil-square me-1"></i>成绩录入
                        </a>
                    </li>
                </ul>
                <div class="d-flex align-items-center gap-3">
                    <span id="userDisplay" class="user-badge"></span>
                    <button class="btn-logout" id="btnLogout">
                        <i class="bi bi-box-arrow-right me-1"></i>退出
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <div class="container-fluid py-4 px-4">
        <div class="page-header">
            <h4><i class="bi bi-people-fill me-2"></i>选课学生名单</h4>
            <p>查看每门课程的学生选课情况</p>
        </div>

        <!-- 课程选择 -->
        <div class="filter-bar">
            <label class="form-label mb-0 me-2"><strong>选择课程：</strong></label>
            <select class="form-select" id="courseSelect" onchange="loadRoster()">
                <option value="">-- 请选择课程 --</option>
            </select>
            <div class="ms-auto">
                <span class="text-muted" style="font-size:.85rem;">
                    共 <strong id="studentCount">0</strong> 名学生
                </span>
                <button class="btn btn-outline-secondary btn-sm ms-2" onclick="printRoster()">
                    <i class="bi bi-printer me-1"></i>打印名单
                </button>
            </div>
        </div>

        <!-- 课程信息卡片 -->
        <div id="courseInfo" class="section-card" style="display:none;"></div>

        <!-- 学生列表 -->
        <div class="section-card">
            <div class="section-title"><i class="bi bi-list-ul me-2"></i>学生列表</div>
            <div class="table-responsive">
                <table class="table table-custom">
                    <thead>
                        <tr>
                            <th>序号</th><th>学号</th><th>姓名</th><th>性别</th>
                            <th>学院</th><th>选课时间</th><th>成绩</th><th>状态</th>
                        </tr>
                    </thead>
                    <tbody id="rosterTableBody">
                        <tr><td colspan="8" class="text-center text-muted py-4">
                            请先选择课程
                        </td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <div class="toast-container" id="toastContainer"></div>

    <script src="https://cdn.bootcdn.net/ajax/libs/twitter-bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/utils.js"></script>
    <script>
        requireRole('teacher');

        document.addEventListener('DOMContentLoaded', () => {
            setActiveNav('nav-roster');
            loadCourses();
            // 从URL获取预选课程
            const params = new URLSearchParams(window.location.search);
            const courseId = params.get('course_id');
            if (courseId) {
                document.getElementById('courseSelect').dataset.preselected = courseId;
            }
        });

        async function loadCourses() {
            try {
                const data = await TeacherAPI.getMyCourses();
                const courses = data.data || data || [];
                const select = document.getElementById('courseSelect');
                select.innerHTML = '<option value="">-- 请选择课程 --</option>' +
                    courses.map(c => `<option value="${c.course_id}">${c.course_name} (${c.course_id})</option>`).join('');

                // 自动选中预选课程
                const preselected = select.dataset.preselected;
                if (preselected) {
                    select.value = preselected;
                    delete select.dataset.preselected;
                    loadRoster();
                }
            } catch (err) {
                showToast('加载课程列表失败', 'danger');
            }
        }

        async function loadRoster() {
            const courseId = document.getElementById('courseSelect').value;
            if (!courseId) {
                document.getElementById('rosterTableBody').innerHTML =
                    '<tr><td colspan="8" class="text-center text-muted py-4">请先选择课程</td></tr>';
                document.getElementById('courseInfo').style.display = 'none';
                document.getElementById('studentCount').textContent = '0';
                return;
            }

            showLoading();
            try {
                const data = await TeacherAPI.getStudentRoster(courseId);
                const students = data.data || data || [];
                document.getElementById('studentCount').textContent = students.length;

                // 显示课程信息
                if (students.length > 0) {
                    const first = students[0];
                    document.getElementById('courseInfo').style.display = 'block';
                    document.getElementById('courseInfo').innerHTML = `
                        <div class="row">
                            <div class="col-md-3"><span class="text-muted">课程名称：</span><strong>${first.course_name || '--'}</strong></div>
                            <div class="col-md-3"><span class="text-muted">上课时间：</span>${first.schedule_time || '--'}</div>
                            <div class="col-md-3"><span class="text-muted">选课人数：</span><strong>${students.length}</strong></div>
                            <div class="col-md-3"><span class="text-muted">已录入成绩：</span>${students.filter(s => s.grade !== null && s.grade !== undefined && s.grade !== '').length}</div>
                        </div>`;
                }

                renderTable(students);
            } catch (err) {
                showToast('加载名单失败: ' + err.message, 'danger');
            } finally {
                hideLoading();
            }
        }

        function renderTable(students) {
            const tbody = document.getElementById('rosterTableBody');
            if (students.length === 0) {
                tbody.innerHTML = `<tr><td colspan="8" class="text-center text-muted py-4">
                    <i class="bi bi-inbox" style="font-size:1.5rem;"></i>
                    <p class="mt-2 mb-0">该课程暂无学生选课</p>
                </td></tr>`;
                return;
            }

            tbody.innerHTML = students.map((s, i) => {
                const grade = s.grade ?? s.score;
                return `
                <tr>
                    <td>${i + 1}</td>
                    <td><code>${s.student_id}</code></td>
                    <td>${s.student_name}</td>
                    <td>${s.gender || '--'}</td>
                    <td>${s.student_college || '--'}</td>
                    <td><small>${formatDate(s.enroll_time)}</small></td>
                    <td>${grade !== null && grade !== undefined && grade !== '' ? `<strong>${grade}</strong>分` : '--'}</td>
                    <td>${getGradeBadge(grade)}</td>
                </tr>`;
            }).join('');
        }

        function printRoster() {
            // 简单打印样式
            const courseName = document.getElementById('courseSelect').selectedOptions[0]?.text || '';
            const printContent = document.querySelector('.section-card').cloneNode(true);
            const printWin = window.open('', '_blank', 'width=800,height=600');
            printWin.document.write(`
                <html><head><title>学生名单 - ${courseName}</title>
                <link href="https://cdn.bootcdn.net/ajax/libs/twitter-bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
                <style>body{padding:20px;} @media print{body{padding:0;}}</style>
                </head><body>
                <h4 class="mb-3">选课学生名单 - ${courseName}</h4>
                ${printContent.innerHTML}
                </body></html>`);
            printWin.document.close();
            printWin.focus();
            setTimeout(() => printWin.print(), 500);
        }
    </script>
</body>
</html>
