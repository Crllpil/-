<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的课表 - 学生选课管理系统</title>
    <link href="https://cdn.bootcdn.net/ajax/libs/twitter-bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.bootcdn.net/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-custom">
        <div class="container-fluid">
            <a class="navbar-brand" href="#"><i class="bi bi-mortarboard-fill"></i>学生选课管理系统</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" id="nav-courses" href="dashboard.html">
                            <i class="bi bi-grid-fill me-1"></i>可选课程
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" id="nav-schedule" href="my_courses.html">
                            <i class="bi bi-calendar-week me-1"></i>我的课表
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" id="nav-grades" href="grades.html">
                            <i class="bi bi-journal-text me-1"></i>成绩查询
                        </a>
                    </li>
                </ul>
                <div class="d-flex align-items-center gap-3">
                    <span id="userDisplay" class="user-badge"></span>
                    <button class="btn-logout" id="btnLogout">
                        <i class="bi bi-box-arrow-right me-1"></i>退出
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <div class="container-fluid py-4 px-4">
        <div class="page-header">
            <h4><i class="bi bi-calendar-week me-2"></i>我的课表</h4>
            <p>查看已选课程安排，支持退课操作（注：有成绩或超30天不可退课）</p>
        </div>

        <!-- 统计卡片 -->
        <div class="row g-3 mb-4" id="statsRow"></div>

        <!-- 课表表格 -->
        <div class="section-card">
            <div class="section-title"><i class="bi bi-table me-2"></i>课程列表</div>
            <div class="table-responsive">
                <table class="table table-custom">
                    <thead>
                        <tr>
                            <th>课程号</th><th>课程名称</th><th>学分</th>
                            <th>授课教师</th><th>上课时间</th><th>上课地点</th>
                            <th>选课时间</th><th>成绩</th><th>操作</th>
                        </tr>
                    </thead>
                    <tbody id="scheduleTableBody">
                        <tr><td colspan="9" class="text-center text-muted py-4">加载中...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- 退课确认模态框 -->
    <div class="modal fade" id="dropModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header bg-danger">
                    <h5 class="modal-title"><i class="bi bi-exclamation-triangle me-2"></i>确认退课</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" id="dropModalBody"></div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                    <button type="button" class="btn btn-danger-custom" id="confirmDropBtn">
                        <i class="bi bi-trash me-1"></i>确认退课
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div class="toast-container" id="toastContainer"></div>

    <script src="https://cdn.bootcdn.net/ajax/libs/twitter-bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/utils.js"></script>
    <script>
        let scheduleData = [];
        let pendingDropId = null;
        requireRole('student');

        document.addEventListener('DOMContentLoaded', () => {
            setActiveNav('nav-schedule');
            loadSchedule();
        });

        async function loadSchedule() {
            showLoading();
            try {
                const data = await StudentAPI.getMySchedule();
                scheduleData = data.data || data || [];
                renderStats();
                renderTable(scheduleData);
            } catch (err) {
                showToast('加载课表失败: ' + err.message, 'danger');
                document.getElementById('scheduleTableBody').innerHTML =
                    '<tr><td colspan="9" class="text-center text-danger py-4">加载失败，请刷新重试</td></tr>';
            } finally {
                hideLoading();
            }
        }

        function renderStats() {
            const total = scheduleData.length;
            const totalCredits = scheduleData.reduce((sum, c) => sum + (parseFloat(c.credit) || 0), 0);
            const graded = scheduleData.filter(c => c.grade !== null && c.grade !== undefined && c.grade !== '').length;
            const passed = scheduleData.filter(c => parseFloat(c.grade) >= 60).length;

            document.getElementById('statsRow').innerHTML = `
                <div class="col-xl-3 col-md-6">
                    <div class="card stat-card">
                        <div class="card-body d-flex align-items-center gap-3">
                            <div class="stat-icon" style="background:var(--sec);"><i class="bi bi-book"></i></div>
                            <div><div class="stat-value">${total}</div><div class="stat-label">已选课程</div></div>
                        </div>
                    </div>
                </div>
                <div class="col-xl-3 col-md-6">
                    <div class="card stat-card">
                        <div class="card-body d-flex align-items-center gap-3">
                            <div class="stat-icon" style="background:var(--acc);"><i class="bi bi-award"></i></div>
                            <div><div class="stat-value">${totalCredits}</div><div class="stat-label">总学分</div></div>
                        </div>
                    </div>
                </div>
                <div class="col-xl-3 col-md-6">
                    <div class="card stat-card">
                        <div class="card-body d-flex align-items-center gap-3">
                            <div class="stat-icon" style="background:var(--warn);"><i class="bi bi-pencil-square"></i></div>
                            <div><div class="stat-value">${graded}</div><div class="stat-label">已出成绩</div></div>
                        </div>
                    </div>
                </div>
                <div class="col-xl-3 col-md-6">
                    <div class="card stat-card">
                        <div class="card-body d-flex align-items-center gap-3">
                            <div class="stat-icon" style="background:#27ae60;"><i class="bi bi-check-circle"></i></div>
                            <div><div class="stat-value">${passed}</div><div class="stat-label">已通过</div></div>
                        </div>
                    </div>
                </div>`;
        }

        function renderTable(data) {
            const tbody = document.getElementById('scheduleTableBody');
            if (data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="9" class="text-center text-muted py-4">
                    <i class="bi bi-inbox" style="font-size:1.5rem;"></i>
                    <p class="mt-2 mb-0">暂未选课，请前往 <a href="dashboard.html">可选课程</a> 选课</p>
                </td></tr>`;
                return;
            }

            tbody.innerHTML = data.map(c => {
                const grade = c.grade ?? c.score;
                const canDrop = grade === null || grade === undefined || grade === '';
                return `
                <tr>
                    <td><code>${c.course_id}</code></td>
                    <td><strong>${c.course_name}</strong></td>
                    <td>${c.credit}</td>
                    <td>${c.teacher_name || '--'} <small class="text-muted">${c.teacher_title || ''}</small></td>
                    <td>${c.schedule_time || '--'}</td>
                    <td>${c.location || '--'}</td>
                    <td><small>${formatDate(c.enroll_time)}</small></td>
                    <td>${getGradeBadge(grade)} ${grade !== null && grade !== undefined && grade !== '' ? grade + '分' : ''}</td>
                    <td>
                        <button class="btn btn-sm ${canDrop ? 'btn-outline-danger' : 'btn-outline-secondary'}"
                                ${canDrop ? `onclick="showDropConfirm('${c.course_id}', '${c.course_name}')"` : 'disabled'}
                                title="${canDrop ? '退课' : '已有成绩不可退课'}">
                            <i class="bi bi-x-circle"></i> 退课
                        </button>
                    </td>
                </tr>`;
            }).join('');
        }

        function showDropConfirm(courseId, courseName) {
            pendingDropId = courseId;
            document.getElementById('dropModalBody').innerHTML = `
                <div class="text-center mb-3">
                    <i class="bi bi-exclamation-triangle text-danger" style="font-size:3rem;"></i>
                </div>
                <p>确定要退选课程 <strong class="text-danger">${courseName}</strong> 吗？</p>
                <p class="mb-0 text-muted" style="font-size:.82rem;">
                    <i class="bi bi-info-circle me-1"></i>注意：退课后数据不可恢复，请慎重操作
                </p>`;
            document.getElementById('confirmDropBtn').onclick = doDrop;
            new bootstrap.Modal(document.getElementById('dropModal')).show();
        }

        async function doDrop() {
            if (!pendingDropId) return;
            const btn = document.getElementById('confirmDropBtn');
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span>处理中...';
            try {
                const result = await StudentAPI.drop(pendingDropId);
                showToast(result.message || '退课成功', 'success');
                bootstrap.Modal.getInstance(document.getElementById('dropModal')).hide();
                loadSchedule();
            } catch (err) {
                showToast(err.message || '退课失败', 'danger');
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="bi bi-trash me-1"></i>确认退课';
                pendingDropId = null;
            }
        }
    </script>
</body>
</html>
