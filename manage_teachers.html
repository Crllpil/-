<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>教师管理 - 学生选课管理系统</title>
    <link href="https://cdn.bootcdn.net/ajax/libs/twitter-bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.bootcdn.net/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-custom">
        <div class="container-fluid">
            <a class="navbar-brand" href="#"><i class="bi bi-mortarboard-fill"></i>学生选课管理系统</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link" id="nav-dashboard" href="dashboard.html"><i class="bi bi-speedometer2 me-1"></i>系统概览</a></li>
                    <li class="nav-item"><a class="nav-link" id="nav-students" href="manage_students.html"><i class="bi bi-person-fill me-1"></i>学生管理</a></li>
                    <li class="nav-item"><a class="nav-link active" id="nav-teachers" href="manage_teachers.html"><i class="bi bi-person-workspace me-1"></i>教师管理</a></li>
                    <li class="nav-item"><a class="nav-link" id="nav-courses" href="manage_courses.html"><i class="bi bi-book-fill me-1"></i>课程管理</a></li>
                </ul>
                <div class="d-flex align-items-center gap-3">
                    <span id="userDisplay" class="user-badge"></span>
                    <button class="btn-logout" id="btnLogout"><i class="bi bi-box-arrow-right me-1"></i>退出</button>
                </div>
            </div>
        </div>
    </nav>

    <div class="container-fluid py-4 px-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <div class="page-header mb-0">
                <h4><i class="bi bi-person-workspace me-2"></i>教师信息管理</h4>
                <p>查看、添加、编辑、删除教师信息（注：有授课的教师受外键约束不可删除）</p>
            </div>
            <button class="btn btn-success-custom" onclick="showAddModal()">
                <i class="bi bi-plus-lg me-1"></i>添加教师
            </button>
        </div>

        <div class="filter-bar">
            <input type="text" class="form-control" id="searchInput" placeholder="🔍 搜索工号/姓名/职称..." oninput="filterTable()">
            <span class="ms-auto text-muted" style="font-size:.85rem;">共 <strong id="totalCount">0</strong> 名教师</span>
        </div>

        <div class="section-card p-0">
            <div class="table-responsive">
                <table class="table table-custom mb-0">
                    <thead>
                        <tr>
                            <th>工号</th><th>姓名</th><th>性别</th><th>职称</th><th>密码</th><th>操作</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody">
                        <tr><td colspan="6" class="text-center text-muted py-4">加载中...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- 编辑模态框 -->
    <div class="modal fade" id="editModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header" id="editModalHeader">
                    <h5 class="modal-title"><i class="bi bi-person-plus me-2"></i>添加教师</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="editMode" value="add">
                    <input type="hidden" id="origTeacherId" value="">
                    <div class="mb-3">
                        <label class="form-label">工号 <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="teacherId" maxlength="8" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">姓名 <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="name" maxlength="20" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">性别 <span class="text-danger">*</span></label>
                        <select class="form-select" id="gender">
                            <option value="男">男</option><option value="女">女</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">职称</label>
                        <select class="form-select" id="title">
                            <option value="">-- 请选择 --</option>
                            <option value="教授">教授</option>
                            <option value="副教授">副教授</option>
                            <option value="讲师">讲师</option>
                            <option value="助教">助教</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">密码</label>
                        <input type="text" class="form-control" id="password" maxlength="32" value="123456">
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                    <button type="button" class="btn btn-success-custom" id="saveBtn" onclick="saveTeacher()">
                        <i class="bi bi-check-lg me-1"></i>保 存
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div class="toast-container" id="toastContainer"></div>

    <script src="https://cdn.bootcdn.net/ajax/libs/twitter-bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/utils.js"></script>
    <script>
        let allTeachers = [];
        requireRole('admin');

        document.addEventListener('DOMContentLoaded', () => {
            setActiveNav('nav-teachers');
            loadTeachers();
        });

        async function loadTeachers() {
            showLoading();
            try {
                const data = await AdminAPI.getTeachers();
                allTeachers = data.data || data || [];
                document.getElementById('totalCount').textContent = allTeachers.length;
                renderTable(allTeachers);
            } catch (err) {
                showToast('加载教师列表失败: ' + err.message, 'danger');
            } finally { hideLoading(); }
        }

        function renderTable(teachers) {
            const tbody = document.getElementById('tableBody');
            if (teachers.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" class="text-center text-muted py-4">暂无教师数据</td></tr>';
                return;
            }
            tbody.innerHTML = teachers.map(t => `
                <tr>
                    <td><code>${t.teacher_id}</code></td>
                    <td><strong>${t.name}</strong></td>
                    <td>${t.gender}</td>
                    <td>${t.title || '--'}</td>
                    <td><code>${t.password || '123456'}</code></td>
                    <td>
                        <button class="btn btn-sm btn-outline-primary me-1" onclick="showEditModal('${t.teacher_id}')">
                            <i class="bi bi-pencil"></i> 编辑
                        </button>
                        <button class="btn btn-sm btn-outline-danger" onclick="deleteTeacher('${t.teacher_id}','${t.name}')">
                            <i class="bi bi-trash"></i> 删除
                        </button>
                    </td>
                </tr>
            `).join('');
        }

        function filterTable() {
            const kw = document.getElementById('searchInput').value.toLowerCase();
            const filtered = allTeachers.filter(t =>
                t.teacher_id.toLowerCase().includes(kw) ||
                t.name.toLowerCase().includes(kw) ||
                (t.title || '').toLowerCase().includes(kw)
            );
            document.getElementById('totalCount').textContent = filtered.length;
            renderTable(filtered);
        }

        function showAddModal() {
            document.getElementById('editMode').value = 'add';
            document.getElementById('origTeacherId').value = '';
            document.getElementById('editModalHeader').innerHTML = '<h5 class="modal-title"><i class="bi bi-person-plus me-2"></i>添加教师</h5>';
            document.getElementById('teacherId').value = '';
            document.getElementById('teacherId').disabled = false;
            document.getElementById('name').value = '';
            document.getElementById('gender').value = '男';
            document.getElementById('title').value = '';
            document.getElementById('password').value = '123456';
            document.getElementById('saveBtn').innerHTML = '<i class="bi bi-check-lg me-1"></i>保 存';
            new bootstrap.Modal(document.getElementById('editModal')).show();
        }

        function showEditModal(teacherId) {
            const t = allTeachers.find(tc => tc.teacher_id === teacherId);
            if (!t) return showToast('未找到该教师', 'danger');
            document.getElementById('editMode').value = 'edit';
            document.getElementById('origTeacherId').value = teacherId;
            document.getElementById('editModalHeader').innerHTML = '<h5 class="modal-title"><i class="bi bi-pencil me-2"></i>编辑教师信息</h5>';
            document.getElementById('teacherId').value = t.teacher_id;
            document.getElementById('teacherId').disabled = true;
            document.getElementById('name').value = t.name;
            document.getElementById('gender').value = t.gender;
            document.getElementById('title').value = t.title || '';
            document.getElementById('password').value = t.password || '123456';
            new bootstrap.Modal(document.getElementById('editModal')).show();
        }

        async function saveTeacher() {
            const mode = document.getElementById('editMode').value;
            const data = {
                teacher_id: document.getElementById('teacherId').value.trim(),
                name: document.getElementById('name').value.trim(),
                gender: document.getElementById('gender').value,
                title: document.getElementById('title').value || null,
                password: document.getElementById('password').value.trim() || '123456',
            };
            if (!data.teacher_id || !data.name) return showToast('请填写必填字段', 'warning');

            const btn = document.getElementById('saveBtn');
            btn.disabled = true; btn.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span>保存中...';
            try {
                if (mode === 'add') {
                    await AdminAPI.addTeacher(data);
                    showToast('添加成功', 'success');
                } else {
                    await AdminAPI.updateTeacher(document.getElementById('origTeacherId').value, data);
                    showToast('更新成功', 'success');
                }
                bootstrap.Modal.getInstance(document.getElementById('editModal')).hide();
                loadTeachers();
            } catch (err) {
                showToast('保存失败: ' + err.message, 'danger');
            } finally {
                btn.disabled = false; btn.innerHTML = '<i class="bi bi-check-lg me-1"></i>保 存';
            }
        }

        async function deleteTeacher(teacherId, name) {
            if (!confirm(`确定要删除教师 "${name}" (${teacherId}) 吗？\n\n注意：有授课的教师受外键约束不可删除。`)) return;
            try {
                await AdminAPI.deleteTeacher(teacherId);
                showToast('删除成功', 'success');
                loadTeachers();
            } catch (err) {
                showToast('删除失败: ' + err.message, 'danger');
            }
        }
    </script>
</body>
</html>
