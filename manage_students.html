<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>学生管理 - 学生选课管理系统</title>
    <link href="https://cdn.bootcdn.net/ajax/libs/twitter-bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.bootcdn.net/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-custom">
        <div class="container-fluid">
            <a class="navbar-brand" href="#"><i class="bi bi-mortarboard-fill"></i>学生选课管理系统</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" id="nav-dashboard" href="dashboard.html"><i class="bi bi-speedometer2 me-1"></i>系统概览</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" id="nav-students" href="manage_students.html"><i class="bi bi-person-fill me-1"></i>学生管理</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" id="nav-teachers" href="manage_teachers.html"><i class="bi bi-person-workspace me-1"></i>教师管理</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" id="nav-courses" href="manage_courses.html"><i class="bi bi-book-fill me-1"></i>课程管理</a>
                    </li>
                </ul>
                <div class="d-flex align-items-center gap-3">
                    <span id="userDisplay" class="user-badge"></span>
                    <button class="btn-logout" id="btnLogout"><i class="bi bi-box-arrow-right me-1"></i>退出</button>
                </div>
            </div>
        </div>
    </nav>

    <div class="container-fluid py-4 px-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <div class="page-header mb-0">
                <h4><i class="bi bi-person-fill me-2"></i>学生信息管理</h4>
                <p>查看、添加、编辑、删除学生信息</p>
            </div>
            <button class="btn btn-primary-custom" onclick="showAddModal()">
                <i class="bi bi-plus-lg me-1"></i>添加学生
            </button>
        </div>

        <!-- 搜索 -->
        <div class="filter-bar">
            <input type="text" class="form-control" id="searchInput" placeholder="🔍 搜索学号/姓名/学院..." oninput="filterTable()">
            <span class="ms-auto text-muted" style="font-size:.85rem;">共 <strong id="totalCount">0</strong> 名学生</span>
        </div>

        <div class="section-card p-0">
            <div class="table-responsive">
                <table class="table table-custom mb-0">
                    <thead>
                        <tr>
                            <th>学号</th><th>姓名</th><th>性别</th><th>出生日期</th><th>学院</th><th>密码</th><th>操作</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody">
                        <tr><td colspan="7" class="text-center text-muted py-4">加载中...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- 添加/编辑模态框 -->
    <div class="modal fade" id="editModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header" id="editModalHeader">
                    <h5 class="modal-title"><i class="bi bi-person-plus me-2"></i>添加学生</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="editForm">
                        <input type="hidden" id="editMode" value="add">
                        <input type="hidden" id="origStudentId" value="">
                        <div class="mb-3">
                            <label class="form-label">学号 <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="studentId" maxlength="10" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">姓名 <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="name" maxlength="20" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">性别 <span class="text-danger">*</span></label>
                            <select class="form-select" id="gender">
                                <option value="男">男</option><option value="女">女</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">出生日期</label>
                            <input type="date" class="form-control" id="birthDate">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">学院 <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="college" maxlength="30" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">密码</label>
                            <input type="text" class="form-control" id="password" maxlength="32" value="123456">
                            <small class="text-muted">默认密码：123456</small>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                    <button type="button" class="btn btn-primary-custom" id="saveBtn" onclick="saveStudent()">
                        <i class="bi bi-check-lg me-1"></i>保 存
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div class="toast-container" id="toastContainer"></div>

    <script src="https://cdn.bootcdn.net/ajax/libs/twitter-bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/utils.js"></script>
    <script>
        let allStudents = [];
        requireRole('admin');

        document.addEventListener('DOMContentLoaded', () => {
            setActiveNav('nav-students');
            loadStudents();
        });

        async function loadStudents() {
            showLoading();
            try {
                const data = await AdminAPI.getStudents();
                allStudents = data.data || data || [];
                document.getElementById('totalCount').textContent = allStudents.length;
                renderTable(allStudents);
            } catch (err) {
                showToast('加载学生列表失败: ' + err.message, 'danger');
            } finally {
                hideLoading();
            }
        }

        function renderTable(students) {
            const tbody = document.getElementById('tableBody');
            if (students.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7" class="text-center text-muted py-4">暂无学生数据</td></tr>';
                return;
            }
            tbody.innerHTML = students.map(s => `
                <tr>
                    <td><code>${s.student_id}</code></td>
                    <td><strong>${s.name}</strong></td>
                    <td>${s.gender}</td>
                    <td>${s.birth_date || '--'}</td>
                    <td>${s.college}</td>
                    <td><code>${s.password || '123456'}</code></td>
                    <td>
                        <button class="btn btn-sm btn-outline-primary me-1" onclick="showEditModal('${s.student_id}')">
                            <i class="bi bi-pencil"></i> 编辑
                        </button>
                        <button class="btn btn-sm btn-outline-danger" onclick="deleteStudent('${s.student_id}','${s.name}')">
                            <i class="bi bi-trash"></i> 删除
                        </button>
                    </td>
                </tr>
            `).join('');
        }

        function filterTable() {
            const kw = document.getElementById('searchInput').value.toLowerCase();
            const filtered = allStudents.filter(s =>
                s.student_id.toLowerCase().includes(kw) ||
                s.name.toLowerCase().includes(kw) ||
                s.college.toLowerCase().includes(kw)
            );
            document.getElementById('totalCount').textContent = filtered.length;
            renderTable(filtered);
        }

        function showAddModal() {
            document.getElementById('editMode').value = 'add';
            document.getElementById('origStudentId').value = '';
            document.getElementById('editModalHeader').innerHTML = '<h5 class="modal-title"><i class="bi bi-person-plus me-2"></i>添加学生</h5>';
            document.getElementById('studentId').value = '';
            document.getElementById('studentId').disabled = false;
            document.getElementById('name').value = '';
            document.getElementById('gender').value = '男';
            document.getElementById('birthDate').value = '';
            document.getElementById('college').value = '';
            document.getElementById('password').value = '123456';
            new bootstrap.Modal(document.getElementById('editModal')).show();
        }

        function showEditModal(studentId) {
            const s = allStudents.find(st => st.student_id === studentId);
            if (!s) return showToast('未找到该学生', 'danger');

            document.getElementById('editMode').value = 'edit';
            document.getElementById('origStudentId').value = studentId;
            document.getElementById('editModalHeader').innerHTML = '<h5 class="modal-title"><i class="bi bi-pencil me-2"></i>编辑学生信息</h5>';
            document.getElementById('studentId').value = s.student_id;
            document.getElementById('studentId').disabled = true;
            document.getElementById('name').value = s.name;
            document.getElementById('gender').value = s.gender;
            document.getElementById('birthDate').value = s.birth_date || '';
            document.getElementById('college').value = s.college;
            document.getElementById('password').value = s.password || '123456';
            new bootstrap.Modal(document.getElementById('editModal')).show();
        }

        async function saveStudent() {
            const mode = document.getElementById('editMode').value;
            const data = {
                student_id: document.getElementById('studentId').value.trim(),
                name: document.getElementById('name').value.trim(),
                gender: document.getElementById('gender').value,
                birth_date: document.getElementById('birthDate').value || null,
                college: document.getElementById('college').value.trim(),
                password: document.getElementById('password').value.trim() || '123456',
            };

            if (!data.student_id || !data.name || !data.college) {
                return showToast('请填写必填字段', 'warning');
            }

            const btn = document.getElementById('saveBtn');
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span>保存中...';

            try {
                if (mode === 'add') {
                    await AdminAPI.addStudent(data);
                    showToast('添加成功', 'success');
                } else {
                    const origId = document.getElementById('origStudentId').value;
                    await AdminAPI.updateStudent(origId, data);
                    showToast('更新成功', 'success');
                }
                bootstrap.Modal.getInstance(document.getElementById('editModal')).hide();
                loadStudents();
            } catch (err) {
                showToast('保存失败: ' + err.message, 'danger');
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="bi bi-check-lg me-1"></i>保 存';
            }
        }

        async function deleteStudent(studentId, name) {
            if (!confirm(`确定要删除学生 "${name}" (${studentId}) 吗？\n\n注意：已选课的学生受外键约束不可删除。`)) return;
            try {
                await AdminAPI.deleteStudent(studentId);
                showToast('删除成功', 'success');
                loadStudents();
            } catch (err) {
                showToast('删除失败: ' + err.message, 'danger');
            }
        }
    </script>
</body>
</html>
