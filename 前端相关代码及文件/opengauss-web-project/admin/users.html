<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户与权限 - 智能校园排课系统</title>
    <link rel="icon" href="../favicon.ico">
    <link href="https://cdn.bootcdn.net/ajax/libs/twitter-bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.bootcdn.net/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div id="appNav"></div>

    <div class="container-fluid py-4 px-4">
        <div class="d-flex justify-content-between align-items-start flex-wrap gap-2 mb-3">
            <div class="page-header mb-0">
                <h4><i class="bi bi-people-fill me-2"></i>用户与权限管理</h4>
                <p>维护系统账号、角色与状态，遵循最小授权原则</p>
            </div>
            <div class="page-actions">
                <button class="btn btn-primary-custom" onclick="showAdd()"><i class="bi bi-person-plus me-1"></i>新增用户</button>
            </div>
        </div>

        <div class="filter-bar">
            <input type="text" class="form-control" id="keyword" placeholder="🔍 搜索用户名/姓名..." oninput="applyFilter()">
            <select class="form-select" id="roleFilter" onchange="applyFilter()">
                <option value="">全部角色</option>
                <option value="admin">系统管理员</option>
                <option value="scheduler">教务员</option>
                <option value="teacher">教师</option>
                <option value="student">学生</option>
            </select>
            <span class="ms-auto text-muted" style="font-size:.85rem;">共 <strong id="totalCount">0</strong> 个账号</span>
        </div>

        <div class="section-card p-0">
            <div class="table-responsive">
                <table class="table table-custom mb-0">
                    <thead>
                        <tr><th>用户名</th><th>姓名</th><th>角色</th><th>关联对象</th><th>状态</th><th>最近登录</th><th>操作</th></tr>
                    </thead>
                    <tbody id="tbody"><tr><td colspan="7" class="text-center text-muted py-4">加载中...</td></tr></tbody>
                </table>
            </div>
        </div>
    </div>

    <div class="modal fade" id="editModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header"><h5 class="modal-title" id="modalTitle">新增用户</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
                <div class="modal-body">
                    <input type="hidden" id="editId">
                    <div class="mb-3"><label class="form-label">用户名 <span class="text-danger">*</span></label>
                        <input class="form-control" id="username" maxlength="30" placeholder="登录账号"></div>
                    <div class="mb-3"><label class="form-label">姓名 <span class="text-danger">*</span></label>
                        <input class="form-control" id="name" maxlength="30"></div>
                    <div class="row g-3">
                        <div class="col-md-6"><label class="form-label">角色 <span class="text-danger">*</span></label>
                            <select class="form-select" id="role" onchange="syncRoleLink()">
                                <option value="student">学生</option>
                                <option value="teacher">教师</option>
                                <option value="scheduler">教务员</option>
                                <option value="admin">系统管理员</option>
                            </select></div>
                        <div class="col-md-6"><label class="form-label">状态</label>
                            <select class="form-select" id="status"><option value="1">启用</option><option value="0">停用</option></select></div>
                    </div>
                    <div class="mb-3 mt-3" id="linkWrap">
                        <label class="form-label" id="linkLabel">关联学号</label>
                        <input class="form-control" id="linkId" placeholder="如 CS2301 班级学生可留空，仅用于数据关联">
                    </div>
                    <div class="mb-0"><label class="form-label">联系电话</label>
                        <input class="form-control" id="phone" maxlength="20"></div>
                    <div class="soft-note mt-3"><i class="bi bi-info-circle me-1"></i>演示环境所有账号初始密码为 <code>123456</code>。</div>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                    <button class="btn btn-primary-custom" id="saveBtn" onclick="saveUser()"><i class="bi bi-check-lg me-1"></i>保存</button>
                </div>
            </div>
        </div>
    </div>

    <div class="toast-container" id="toastContainer"></div>

    <script src="https://cdn.bootcdn.net/ajax/libs/twitter-bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
    <script src="../js/algorithm.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/utils.js"></script>
    <script src="../js/mock.js"></script>
    <script src="../js/page-common.js"></script>
    <script src="../js/layout.js"></script>
    <script>
        renderLayout('admin', 'users');
        let users = [];

        document.addEventListener('DOMContentLoaded', loadUsers);

        async function loadUsers() {
            showLoading();
            try {
                const res = await AdminAPI.getUsers();
                users = res.data || res || [];
                renderTable(users);
            } catch (err) { showToast('加载失败：' + err.message, 'danger'); }
            finally { hideLoading(); }
        }

        function renderTable(list) {
            const tbody = document.getElementById('tbody');
            document.getElementById('totalCount').textContent = list.length;
            if (!list.length) return renderEmptyRow(tbody, 7, '暂无用户');
            tbody.innerHTML = list.map(u => {
                const link = u.teacher_no ? `教师 ${escapeHtml(u.teacher_no)}` : (u.class_no ? `班级 ${escapeHtml(u.class_no)}` : (u.teacher_id ? `教师 ${escapeHtml(u.teacher_id)}` : (u.class_id ? `班级 ${escapeHtml(u.class_id)}` : '—')));
                return `<tr>
                    <td><code>${escapeHtml(u.username)}</code></td>
                    <td><strong>${escapeHtml(u.name)}</strong></td>
                    <td><span class="${ROLE_BADGES[u.role] || 'badge bg-secondary'}">${ROLE_LABELS[u.role] || u.role}</span></td>
                    <td><small>${link}</small></td>
                    <td>${Number(u.status) === 1 ? '<span class="badge bg-success">启用</span>' : '<span class="badge bg-secondary">停用</span>'}</td>
                    <td><small class="text-muted">${escapeHtml(u.last_login || '--')}</small></td>
                    <td class="table-actions">
                        <button class="btn btn-sm btn-outline-primary" onclick="showEdit('${u.user_id}')"><i class="bi bi-pencil"></i> 编辑</button>
                        <button class="btn btn-sm btn-outline-secondary" onclick="resetPwd('${u.username}')"><i class="bi bi-key"></i> 重置密码</button>
                        <button class="btn btn-sm btn-outline-danger" onclick="delUser('${u.user_id}','${escapeHtml(u.username)}')"><i class="bi bi-trash"></i></button>
                    </td>
                </tr>`;
            }).join('');
        }

        function applyFilter() {
            const kw = document.getElementById('keyword').value.trim().toLowerCase();
            const role = document.getElementById('roleFilter').value;
            renderTable(users.filter(u =>
                (!kw || (u.username + u.name).toLowerCase().includes(kw)) && (!role || u.role === role)
            ));
        }

        function syncRoleLink() {
            const role = document.getElementById('role').value;
            document.getElementById('linkWrap').style.display = (role === 'teacher' || role === 'student') ? '' : 'none';
            document.getElementById('linkLabel').textContent = role === 'teacher' ? '关联教师工号' : '关联班级编号';
        }

        function showAdd() {
            document.getElementById('modalTitle').textContent = '新增用户';
            document.getElementById('editId').value = '';
            document.getElementById('username').value = '';
            document.getElementById('username').disabled = false;
            document.getElementById('name').value = '';
            document.getElementById('role').value = 'student';
            document.getElementById('status').value = '1';
            document.getElementById('linkId').value = '';
            document.getElementById('phone').value = '';
            syncRoleLink();
            new bootstrap.Modal(document.getElementById('editModal')).show();
        }

        function showEdit(id) {
            const u = users.find(x => String(x.user_id) === String(id));
            if (!u) return;
            document.getElementById('modalTitle').textContent = '编辑用户';
            document.getElementById('editId').value = u.user_id;
            document.getElementById('username').value = u.username;
            document.getElementById('username').disabled = true;
            document.getElementById('name').value = u.name;
            document.getElementById('role').value = u.role;
            document.getElementById('status').value = String(u.status);
            document.getElementById('linkId').value = u.teacher_no || u.class_no || u.teacher_id || u.class_id || '';
            document.getElementById('phone').value = u.phone || '';
            syncRoleLink();
            new bootstrap.Modal(document.getElementById('editModal')).show();
        }

        async function saveUser() {
            const id = document.getElementById('editId').value;
            const role = document.getElementById('role').value;
            const data = {
                username: document.getElementById('username').value.trim(),
                name: document.getElementById('name').value.trim(),
                role,
                status: Number(document.getElementById('status').value),
                phone: document.getElementById('phone').value.trim(),
            };
            if (!data.username || !data.name) return showToast('请填写用户名和姓名', 'warning');
            const link = document.getElementById('linkId').value.trim();
            if (role === 'teacher') data.teacher_id = link || null;
            if (role === 'student') data.class_id = link || null;
            const btn = document.getElementById('saveBtn');
            btn.disabled = true; btn.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span>保存中...';
            try {
                if (id) await AdminAPI.updateUser(id, data);
                else await AdminAPI.addUser(data);
                showToast('保存成功', 'success');
                bootstrap.Modal.getInstance(document.getElementById('editModal')).hide();
                loadUsers();
            } catch (err) { showToast('保存失败：' + err.message, 'danger'); }
            finally { btn.disabled = false; btn.innerHTML = '<i class="bi bi-check-lg me-1"></i>保存'; }
        }

        async function delUser(id, username) {
            if (!await confirmAction('删除用户', `确定删除账号 ${username} 吗？该操作不可恢复。`)) return;
            try {
                await AdminAPI.deleteUser(id);
                showToast('删除成功', 'success');
                loadUsers();
            } catch (err) { showToast('删除失败：' + err.message, 'danger'); }
        }

        function resetPwd(username) {
            showToast(`账号 ${username} 的密码已重置为 123456（演示）`, 'success');
        }
    </script>
</body>
</html>
