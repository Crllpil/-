<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>人工调整 - 智能校园排课系统</title>
    <link rel="icon" href="../favicon.ico">
    <link href="https://cdn.bootcdn.net/ajax/libs/twitter-bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.bootcdn.net/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div id="appNav"></div>

    <div class="container-fluid py-4 px-4">
        <div class="page-header">
            <h4><i class="bi bi-pencil-square me-2"></i>人工调整</h4>
            <p>点击课表条目调整时间段或教室，保存前系统实时校验硬约束冲突</p>
        </div>

        <div class="filter-bar">
            <select class="form-select" id="planSelect" onchange="loadPlan()" style="max-width:330px;"></select>
            <select class="form-select" id="dimension" onchange="populateValues()" style="max-width:140px;">
                <option value="class">按班级</option>
                <option value="teacher">按教师</option>
            </select>
            <select class="form-select" id="dimValue" onchange="renderFiltered()" style="max-width:220px;"></select>
            <span class="ms-auto text-muted" style="font-size:.85rem;">点击课表卡片进行移动</span>
        </div>

        <div class="row g-3">
            <div class="col-xl-9">
                <div class="section-card">
                    <div id="timetable"><div class="empty-state"><i class="bi bi-hourglass-split"></i><p class="mt-2">加载中...</p></div></div>
                    <div class="tt-legend">
                        <span><i class="legend-dot normal"></i>正常课程</span>
                        <span><i class="legend-dot hard"></i>硬约束冲突</span>
                        <span><i class="legend-dot soft"></i>软约束未满足</span>
                    </div>
                </div>
            </div>
            <div class="col-xl-3">
                <div class="section-card">
                    <div class="section-title"><i class="bi bi-exclamation-triangle me-2"></i>当前方案冲突</div>
                    <div id="conflictList"><p class="text-muted mb-0">加载中...</p></div>
                </div>
                <div class="soft-note">
                    <i class="bi bi-info-circle me-1"></i>移动课次时，若目标时段或教室产生教师、班级、教室冲突或容量不足，系统将阻止保存。
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="adjustModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header"><h5 class="modal-title"><i class="bi bi-arrows-move me-2"></i>调整课表条目</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
                <div class="modal-body">
                    <input type="hidden" id="editItemId">
                    <div class="row g-3 mb-3">
                        <div class="col-md-4"><small class="text-muted d-block">课程</small><strong id="infoCourse">--</strong></div>
                        <div class="col-md-4"><small class="text-muted d-block">班级</small><strong id="infoClass">--</strong></div>
                        <div class="col-md-4"><small class="text-muted d-block">教师</small><strong id="infoTeacher">--</strong></div>
                    </div>
                    <div class="row g-3">
                        <div class="col-md-6"><label class="form-label">原时间段</label><input class="form-control" id="oldSlot" disabled></div>
                        <div class="col-md-6"><label class="form-label">原教室</label><input class="form-control" id="oldRoom" disabled></div>
                        <div class="col-md-6"><label class="form-label">新时间段 <span class="text-danger">*</span></label>
                            <select class="form-select" id="newSlot"></select></div>
                        <div class="col-md-6"><label class="form-label">新教室 <span class="text-danger">*</span></label>
                            <select class="form-select" id="newRoom"></select></div>
                    </div>
                    <div id="adjustMsg" class="mt-3"></div>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                    <button class="btn btn-warning-custom" id="saveBtn" onclick="saveAdjust()"><i class="bi bi-check-lg me-1"></i>校验并保存</button>
                </div>
            </div>
        </div>
    </div>

    <div class="toast-container" id="toastContainer"></div>

    <script src="https://cdn.bootcdn.net/ajax/libs/twitter-bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
    <script src="../js/algorithm.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/utils.js"></script>
    <script src="../js/mock.js"></script>
    <script src="../js/page-common.js"></script>
    <script src="../js/layout.js"></script>
    <script>
        renderLayout('scheduler', 'adjust');
        let plans = [], items = [], conflicts = [], rooms = [], slots = [], filtered = [], editItem = null;

        document.addEventListener('DOMContentLoaded', init);

        async function init() {
            showLoading();
            try {
                const [planRes, roomRes, slotRes] = await Promise.all([
                    SchedulerAPI.getPlans(), SchedulerAPI.getClassrooms(), SchedulerAPI.getTimeSlots(),
                ]);
                plans = planRes.data || planRes || [];
                rooms = (roomRes.data || roomRes || []).filter(r => r.status === '可用');
                slots = slotRes.data || slotRes || [];
                if (!plans.length) {
                    document.getElementById('timetable').innerHTML = '<div class="empty-state"><i class="bi bi-calendar-x"></i><p class="mt-2">暂无排课方案</p></div>';
                    return;
                }
                const active = plans.find(p => p.is_active === 1) || plans[0];
                renderPlanSelect('planSelect', plans, active.plan_id);
                await loadPlan();
            } catch (err) { showToast('加载失败：' + err.message, 'danger'); }
            finally { hideLoading(); }
        }

        async function loadPlan() {
            const planId = document.getElementById('planSelect').value;
            if (!planId) return;
            showLoading();
            try {
                const [itemRes, conflictRes] = await Promise.all([
                    SchedulerAPI.getPlanItems(planId), SchedulerAPI.getPlanConflicts(planId),
                ]);
                const data = itemRes.data || itemRes;
                items = data.items || [];
                conflicts = conflictRes.data || conflictRes || [];
                populateValues();
                renderConflicts();
            } catch (err) { showToast('加载失败：' + err.message, 'danger'); }
            finally { hideLoading(); }
        }

        function populateValues() {
            const dim = document.getElementById('dimension').value;
            const map = new Map();
            items.forEach(it => {
                const key = dim === 'class' ? it.class_id : it.teacher_id;
                const text = dim === 'class' ? (it.class_name || it.class_id) : (it.teacher_name || it.teacher_id);
                if (!map.has(key)) map.set(key, text);
            });
            const sel = document.getElementById('dimValue');
            sel.innerHTML = Array.from(map.keys()).sort().map(k => `<option value="${escapeHtml(k)}">${escapeHtml(map.get(k))}</option>`).join('');
            renderFiltered();
        }

        function renderFiltered() {
            const dim = document.getElementById('dimension').value;
            const val = document.getElementById('dimValue').value;
            filtered = items.filter(it => (dim === 'class' ? String(it.class_id) === String(val) : String(it.teacher_id) === String(val)));
            renderTimetable('timetable', filtered, {
                conflictMap: itemConflictMap(conflicts),
                showClass: dim !== 'class',
                showTeacher: dim !== 'teacher',
                onItemClick: openAdjust,
            });
        }

        function renderConflicts() {
            const el = document.getElementById('conflictList');
            if (!conflicts.length) {
                el.innerHTML = '<div class="text-center py-3"><i class="bi bi-check-circle-fill text-success fs-3"></i><p class="mt-2 mb-0">当前方案无冲突</p></div>';
                return;
            }
            el.innerHTML = conflicts.slice(0, 8).map(c => `
                <div class="border-bottom pb-2 mb-2">
                    <div class="d-flex justify-content-between">
                        <span class="badge ${c.severity === 'hard' ? 'bg-danger' : 'bg-warning text-dark'}">${escapeHtml(c.conflict_type)}</span>
                        <small class="text-muted">${escapeHtml(c.status)}</small>
                    </div>
                    <div class="conflict-desc mt-1">${escapeHtml(c.description)}</div>
                </div>`).join('') + (conflicts.length > 8 ? `<a href="conflicts.html" class="small">查看全部 ${conflicts.length} 条 →</a>` : '');
        }

        function openAdjust(itemId) {
            editItem = items.find(x => String(x.item_id) === String(itemId));
            if (!editItem) return;
            document.getElementById('editItemId').value = editItem.item_id;
            document.getElementById('infoCourse').textContent = editItem.course_name;
            document.getElementById('infoClass').textContent = editItem.class_name || editItem.class_id;
            document.getElementById('infoTeacher').textContent = editItem.teacher_name || editItem.teacher_id;
            const slot = slots.find(s => s.slot_id === editItem.slot_id);
            const room = rooms.find(r => String(r.room_id) === String(editItem.room_id));
            document.getElementById('oldSlot').value = slot ? slot.label : editItem.slot_id;
            document.getElementById('oldRoom').value = room ? room.name : editItem.room_id;
            document.getElementById('newSlot').innerHTML = slots.map(s =>
                `<option value="${s.slot_id}" ${s.slot_id === editItem.slot_id ? 'selected' : ''}>${escapeHtml(s.label)}</option>`).join('');
            document.getElementById('newRoom').innerHTML = rooms.map(r =>
                `<option value="${r.room_id}" ${String(r.room_id) === String(editItem.room_id) ? 'selected' : ''}>${escapeHtml(r.name)}（${escapeHtml(r.room_type)} / ${r.capacity}人）</option>`).join('');
            document.getElementById('adjustMsg').innerHTML = '';
            document.getElementById('saveBtn').disabled = false;
            new bootstrap.Modal(document.getElementById('adjustModal')).show();
        }

        async function saveAdjust() {
            const id = document.getElementById('editItemId').value;
            const slotId = document.getElementById('newSlot').value;
            const roomId = document.getElementById('newRoom').value;
            const msg = document.getElementById('adjustMsg');
            const btn = document.getElementById('saveBtn');
            btn.disabled = true;
            msg.innerHTML = '<div class="soft-note">正在校验教师冲突、班级冲突、教室冲突与容量约束...</div>';
            try {
                await SchedulerAPI.updateItem(id, { slot_id: slotId, room_id: roomId });
                msg.innerHTML = '<div class="hard-note" style="background:#e8f8f0;border-left-color:#27ae60;color:#1e7e4a;">调整成功，已重新检测方案冲突。</div>';
                showToast('课表调整成功', 'success');
                setTimeout(async () => {
                    bootstrap.Modal.getInstance(document.getElementById('adjustModal')).hide();
                    await loadPlan();
                }, 500);
            } catch (err) {
                msg.innerHTML = `<div class="hard-note"><strong>校验未通过：</strong>${escapeHtml(err.message)}</div>`;
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
